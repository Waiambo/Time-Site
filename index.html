<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMPO — Horário Mundial</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: rgba(255,255,255,0.07);
    --accent: #c8ff00;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #555;
    --mono: 'DM Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 0 48px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .utc-badge {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ── HERO CLOCK ── */
  .hero {
    padding: 64px 0 56px;
    border-bottom: 1px solid var(--border);
  }

  .hero-label {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .hero-time {
    font-family: var(--mono);
    font-size: clamp(64px, 14vw, 120px);
    font-weight: 300;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--text);
    position: relative;
  }

  .hero-time .ms {
    font-size: 0.35em;
    color: var(--accent);
    vertical-align: super;
    letter-spacing: 0;
  }

  .hero-date {
    font-size: 14px;
    color: var(--muted);
    margin-top: 16px;
    font-family: var(--mono);
    letter-spacing: 0.08em;
  }

  .hero-tz {
    display: inline-block;
    margin-top: 20px;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    border: 1px solid var(--accent);
    padding: 4px 12px;
    border-radius: 2px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 0;
    margin: 40px 0 0;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 14px 28px 14px 0;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }

  .tab-btn.active {
    color: var(--accent);
  }

  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 28px;
    height: 2px;
    background: var(--accent);
  }

  .tab-btn:hover { color: var(--text); }

  /* ── PANELS ── */
  .panel { display: none; padding-top: 40px; }
  .panel.active { display: block; }

  /* ── WORLD CLOCKS ── */
  .cities-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-top: 4px;
  }

  .city-card {
    background: var(--bg);
    padding: 24px 20px;
    transition: background 0.2s;
    cursor: default;
  }

  .city-card:hover { background: var(--surface); }

  .city-name {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .city-time {
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .city-diff {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    font-family: var(--mono);
  }

  .city-diff.ahead { color: var(--accent); }
  .city-diff.behind { color: var(--accent2); }

  /* ── STOPWATCH / TIMER ── */
  .tool-display {
    font-family: var(--mono);
    font-size: clamp(60px, 13vw, 110px);
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1;
    margin-bottom: 40px;
    min-height: 1.1em;
  }

  .tool-display.running { color: var(--accent); }
  .tool-display.paused  { color: var(--muted);  }
  .tool-display.done    { color: var(--accent2); animation: pulse 0.6s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    border: 1px solid currentColor;
    background: none;
    padding: 12px 24px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
  }

  .btn-primary { color: var(--accent); }
  .btn-primary:hover { background: var(--accent); color: var(--bg); }

  .btn-secondary { color: var(--muted); }
  .btn-secondary:hover { color: var(--text); border-color: var(--text); }

  .btn-danger { color: var(--accent2); }
  .btn-danger:hover { background: var(--accent2); color: var(--bg); }

  /* LAPS */
  .laps {
    margin-top: 32px;
    max-height: 240px;
    overflow-y: auto;
  }

  .lap-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 13px;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; } }

  .lap-num { color: var(--muted); }
  .lap-time { color: var(--text); }
  .lap-split { color: var(--accent); }

  /* TIMER INPUT */
  .timer-inputs {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .time-input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .time-input-group label {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .time-input-group input {
    width: 70px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 28px;
    text-align: center;
    padding: 8px 4px;
    outline: none;
    border-radius: 2px;
    transition: border-color 0.2s;
  }

  .time-input-group input:focus { border-color: var(--accent); }

  .colon {
    font-family: var(--mono);
    font-size: 28px;
    color: var(--muted);
    align-self: flex-end;
    padding-bottom: 10px;
  }

  /* Timer progress bar */
  .progress-bar {
    height: 2px;
    background: var(--border);
    margin: 24px 0;
    border-radius: 1px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.5s linear;
    border-radius: 1px;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  footer span {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    font-family: var(--mono);
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">TEMPO</div>
    <div class="utc-badge" id="utcBadge">UTC —</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-label">Horário Local</div>
    <div class="hero-time" id="heroTime">00:00:00<span class="ms" id="heroMs">.000</span></div>
    <div class="hero-date" id="heroDate">—</div>
    <div class="hero-tz" id="heroTz">—</div>
  </section>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('world', this)">Mundo</button>
    <button class="tab-btn" onclick="switchTab('stopwatch', this)">Cronômetro</button>
    <button class="tab-btn" onclick="switchTab('timer', this)">Timer</button>
  </div>

  <!-- WORLD PANEL -->
  <div class="panel active" id="panel-world">
    <div class="cities-grid" id="citiesGrid"></div>
  </div>

  <!-- STOPWATCH PANEL -->
  <div class="panel" id="panel-stopwatch">
    <div class="tool-display" id="swDisplay">00:00:00.00</div>
    <div class="controls">
      <button class="btn btn-primary" id="swStartBtn" onclick="swToggle()">Iniciar</button>
      <button class="btn btn-secondary" onclick="swLap()" id="swLapBtn" disabled>Volta</button>
      <button class="btn btn-danger" onclick="swReset()">Zerar</button>
    </div>
    <div class="laps" id="lapsList"></div>
  </div>

  <!-- TIMER PANEL -->
  <div class="panel" id="panel-timer">
    <div class="timer-inputs" id="timerInputs">
      <div class="time-input-group">
        <label>Horas</label>
        <input type="number" id="tH" min="0" max="23" value="0" placeholder="00">
      </div>
      <div class="colon">:</div>
      <div class="time-input-group">
        <label>Minutos</label>
        <input type="number" id="tM" min="0" max="59" value="5" placeholder="00">
      </div>
      <div class="colon">:</div>
      <div class="time-input-group">
        <label>Segundos</label>
        <input type="number" id="tS" min="0" max="59" value="0" placeholder="00">
      </div>
    </div>
    <div class="tool-display" id="timerDisplay">00:05:00</div>
    <div class="progress-bar"><div class="progress-fill" id="timerBar"></div></div>
    <div class="controls">
      <button class="btn btn-primary" id="timerStartBtn" onclick="timerToggle()">Iniciar</button>
      <button class="btn btn-danger" onclick="timerReset()">Zerar</button>
    </div>
  </div>

  <footer>
    <span>TEMPO © 2026</span>
    <span id="syncStatus">⬤ Sincronizado</span>
  </footer>
</div>

<script>
// ── CITIES ──
const CITIES = [
  { name: 'Nova York',    tz: 'America/New_York'      },
  { name: 'São Paulo',    tz: 'America/Sao_Paulo'     },
  { name: 'Londres',      tz: 'Europe/London'         },
  { name: 'Paris',        tz: 'Europe/Paris'          },
  { name: 'Dubai',        tz: 'Asia/Dubai'            },
  { name: 'Mumbai',       tz: 'Asia/Kolkata'          },
  { name: 'Singapura',    tz: 'Asia/Singapore'        },
  { name: 'Tóquio',       tz: 'Asia/Tokyo'            },
  { name: 'Sydney',       tz: 'Australia/Sydney'      },
  { name: 'Los Angeles',  tz: 'America/Los_Angeles'   },
  { name: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires' },
  { name: 'Cairo',        tz: 'Africa/Cairo'          },
];

const DAYS_PT = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MONTHS_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function pad(n, d=2) { return String(n).padStart(d, '0'); }

function formatTime(date, tz) {
  return new Intl.DateTimeFormat('pt-BR', {
    timeZone: tz,
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  }).format(date);
}

function getLocalOffset() {
  return -new Date().getTimezoneOffset() / 60;
}

function getCityOffset(tz) {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('en', {
    timeZone: tz,
    hour: 'numeric', hour12: false
  }).formatToParts(now);
  const localParts = new Intl.DateTimeFormat('en', {
    hour: 'numeric', hour12: false
  }).formatToParts(now);
  const cityH = parseInt(parts.find(p => p.type === 'hour').value);
  const localH = parseInt(localParts.find(p => p.type === 'hour').value);
  return cityH - localH;
}

// Build city cards
const grid = document.getElementById('citiesGrid');
CITIES.forEach(city => {
  const card = document.createElement('div');
  card.className = 'city-card';
  card.id = 'city-' + city.tz.replace(/\//g, '-');
  card.innerHTML = `
    <div class="city-name">${city.name}</div>
    <div class="city-time" id="ct-${city.tz.replace(/\//g, '-')}">--:--:--</div>
    <div class="city-diff" id="cd-${city.tz.replace(/\//g, '-')}">--</div>
  `;
  grid.appendChild(card);
});

// ── MAIN CLOCK LOOP ──
function updateAll() {
  const now = new Date();

  // Hero
  const h = pad(now.getHours()), m = pad(now.getMinutes()), s = pad(now.getSeconds());
  const ms = pad(now.getMilliseconds(), 3).slice(0, 3);
  document.getElementById('heroTime').childNodes[0].nodeValue = `${h}:${m}:${s}`;
  document.getElementById('heroMs').textContent = `.${ms}`;

  const day = DAYS_PT[now.getDay()];
  const date = `${day}, ${pad(now.getDate())} ${MONTHS_PT[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById('heroDate').textContent = date;

  const tzName = Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('heroTz').textContent = tzName;

  // UTC badge
  const utcH = pad(now.getUTCHours()), utcM = pad(now.getUTCMinutes()), utcS = pad(now.getUTCSeconds());
  document.getElementById('utcBadge').textContent = `UTC ${utcH}:${utcM}:${utcS}`;

  // Cities
  const localOff = getLocalOffset();
  CITIES.forEach(city => {
    const key = city.tz.replace(/\//g, '-');
    const t = formatTime(now, city.tz);
    document.getElementById('ct-' + key).textContent = t;

    const diff = getCityOffset(city.tz);
    const el = document.getElementById('cd-' + key);
    if (diff === 0) {
      el.textContent = 'mesmo horário';
      el.className = 'city-diff';
    } else if (diff > 0) {
      el.textContent = `+${diff}h à frente`;
      el.className = 'city-diff ahead';
    } else {
      el.textContent = `${diff}h atrás`;
      el.className = 'city-diff behind';
    }
  });
}

setInterval(updateAll, 16);
updateAll();

// ── TABS ──
function switchTab(id, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

// ── STOPWATCH ──
let swRunning = false, swStartTime = 0, swElapsed = 0, swRaf = null;
let laps = [], lapStart = 0;

function swFormat(ms) {
  const cs = Math.floor(ms / 10) % 100;
  const s  = Math.floor(ms / 1000) % 60;
  const m  = Math.floor(ms / 60000) % 60;
  const hr = Math.floor(ms / 3600000);
  return `${pad(hr)}:${pad(m)}:${pad(s)}.${pad(cs)}`;
}

function swTick() {
  const now = performance.now();
  const total = swElapsed + (now - swStartTime);
  document.getElementById('swDisplay').textContent = swFormat(total);
  if (swRunning) swRaf = requestAnimationFrame(swTick);
}

function swToggle() {
  const btn = document.getElementById('swStartBtn');
  const lapBtn = document.getElementById('swLapBtn');
  const disp = document.getElementById('swDisplay');
  if (!swRunning) {
    swStartTime = performance.now();
    if (laps.length === 0) lapStart = 0;
    swRunning = true;
    btn.textContent = 'Pausar';
    lapBtn.disabled = false;
    disp.className = 'tool-display running';
    swRaf = requestAnimationFrame(swTick);
  } else {
    swElapsed += performance.now() - swStartTime;
    swRunning = false;
    cancelAnimationFrame(swRaf);
    btn.textContent = 'Continuar';
    disp.className = 'tool-display paused';
    lapBtn.disabled = true;
  }
}

function swReset() {
  swRunning = false; cancelAnimationFrame(swRaf);
  swElapsed = 0; laps = []; lapStart = 0;
  document.getElementById('swDisplay').textContent = '00:00:00.00';
  document.getElementById('swDisplay').className = 'tool-display';
  document.getElementById('swStartBtn').textContent = 'Iniciar';
  document.getElementById('swLapBtn').disabled = true;
  document.getElementById('lapsList').innerHTML = '';
}

function swLap() {
  const total = swElapsed + (performance.now() - swStartTime);
  const split = total - lapStart;
  lapStart = total;
  laps.unshift({ n: laps.length + 1, total, split });
  const list = document.getElementById('lapsList');
  const row = document.createElement('div');
  row.className = 'lap-row';
  row.innerHTML = `
    <span class="lap-num">#${pad(laps[0].n)}</span>
    <span class="lap-split">${swFormat(split)}</span>
    <span class="lap-time">${swFormat(total)}</span>
  `;
  list.prepend(row);
}

// ── TIMER ──
let timerRunning = false, timerRaf = null, timerEnd = 0, timerTotal = 0, timerPaused = 0;

function timerFormat(ms) {
  if (ms <= 0) return '00:00:00';
  const s = Math.floor(ms / 1000) % 60;
  const m = Math.floor(ms / 60000) % 60;
  const h = Math.floor(ms / 3600000);
  return `${pad(h)}:${pad(m)}:${pad(s)}`;
}

function timerGetInput() {
  const h = parseInt(document.getElementById('tH').value) || 0;
  const m = parseInt(document.getElementById('tM').value) || 0;
  const s = parseInt(document.getElementById('tS').value) || 0;
  return (h * 3600 + m * 60 + s) * 1000;
}

function timerTick() {
  const remaining = timerEnd - Date.now();
  const disp = document.getElementById('timerDisplay');
  const bar  = document.getElementById('timerBar');
  if (remaining <= 0) {
    disp.textContent = '00:00:00';
    disp.className = 'tool-display done';
    bar.style.width = '100%';
    bar.style.background = 'var(--accent2)';
    timerRunning = false;
    document.getElementById('timerStartBtn').textContent = 'Iniciar';
    document.getElementById('timerInputs').style.opacity = '1';
    return;
  }
  disp.textContent = timerFormat(remaining);
  bar.style.width = ((timerTotal - remaining) / timerTotal * 100) + '%';
  timerRaf = requestAnimationFrame(timerTick);
}

function timerToggle() {
  const btn = document.getElementById('timerStartBtn');
  const disp = document.getElementById('timerDisplay');
  if (!timerRunning) {
    if (!timerPaused) {
      timerTotal = timerGetInput();
      if (!timerTotal) return;
    }
    timerEnd = Date.now() + (timerPaused || timerTotal);
    timerPaused = 0;
    timerRunning = true;
    btn.textContent = 'Pausar';
    disp.className = 'tool-display running';
    document.getElementById('timerInputs').style.opacity = '0.3';
    document.getElementById('timerBar').style.background = 'var(--accent)';
    timerRaf = requestAnimationFrame(timerTick);
  } else {
    timerPaused = timerEnd - Date.now();
    cancelAnimationFrame(timerRaf);
    timerRunning = false;
    btn.textContent = 'Continuar';
    disp.className = 'tool-display paused';
    document.getElementById('timerInputs').style.opacity = '1';
  }
}

function timerReset() {
  cancelAnimationFrame(timerRaf);
  timerRunning = false; timerPaused = 0;
  document.getElementById('timerDisplay').textContent = timerFormat(timerGetInput());
  document.getElementById('timerDisplay').className = 'tool-display';
  document.getElementById('timerStartBtn').textContent = 'Iniciar';
  document.getElementById('timerBar').style.width = '0%';
  document.getElementById('timerBar').style.background = 'var(--accent)';
  document.getElementById('timerInputs').style.opacity = '1';
}

// Update timer display on input change
['tH','tM','tS'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    if (!timerRunning) timerReset();
  });
});
</script>
</body>
</html>
